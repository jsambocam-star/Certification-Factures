<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Ticket – VigiCyberDefense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0B1E36;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #00FF88;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        .card h1 { color: #0B1E36; font-size: 22px; margin-bottom: 5px; }
        .sub { color: #555; font-size: 14px; margin-bottom: 20px; }
        #result {
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            background: #f5f7fa;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .valid { background: #d4edda !important; border-left: 5px solid #28a745; color: #155724; }
        .invalid { background: #f8d7da !important; border-left: 5px solid #dc3545; color: #721c24; }
        .used { background: #fff3cd !important; border-left: 5px solid #ffc107; color: #856404; }
        .info { font-size: 13px; color: #777; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .info span { background: #0B1E36; color: #00FF88; padding: 2px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .btn { display: inline-block; margin-top: 10px; padding: 8px 20px; background: #0B1E36; color: white; text-decoration: none; border-radius: 30px; font-size: 13px; border: none; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #00FF88; color: #0B1E36; }
        .admin-area { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .admin-area details { cursor: pointer; color: #0B1E36; font-weight: bold; }
        .admin-area details summary { padding: 8px; background: #eee; border-radius: 8px; }
        .admin-area details div { margin-top: 15px; }
        .admin-area input[type="password"] { padding: 10px; width: 80%; border: 1px solid #ccc; border-radius: 8px; }
        .admin-area .btn-small { padding: 10px 20px; background: #0B1E36; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #fullList { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; font-size: 14px; }
        #fullList ul { list-style: none; padding: 0; }
        #fullList ul li { padding: 5px 0; border-bottom: 1px solid #ddd; }
        .test-badge { background: #ffc107; color: #000; font-size: 11px; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🛡️</div>
    <h1>VigiCyberDefense</h1>
    <p class="sub">Conférence Cybersécurité – Luanda 2026</p>

    <div id="result">
        🔍 Scan en cours...
    </div>

    <div class="info">
        <span>JETON UNIQUE</span> – Chaque ticket est personnel.
    </div>
    <button class="btn" onclick="window.location.reload();">🔄 Réessayer</button>

    <!-- Zone Sécurisée pour l'Équipe VigiCyberDefense -->
    <div class="admin-area">
        <details>
            <summary>🔐 Zone Équipe VigiCyberDefense</summary>
            <div>
                <p style="font-size:14px; color:#555; margin-bottom:10px;">Entrez le mot de passe d'équipe pour voir la liste complète :</p>
                <input type="password" id="adminPass" placeholder="Mot de passe équipe" style="padding:10px; width:70%; border:1px solid #ccc; border-radius:8px;">
                <button class="btn-small" onclick="showFullList()">Afficher la liste</button>
                <div id="fullList"></div>
            </div>
        </details>
    </div>
</div>

<script>
    // =============================================
    // 1. LISTE DES INVITÉS (TOKENS 001 à 040)
    // =============================================
    // TOKENS 001 à 005 = TESTS
    // TOKENS 006 à 040 = INVITÉS RÉELS
    const attendees = {
        // === TOKENS DE TEST (001 à 005) ===
        'TKT-001': 'TEST - Ovounga Hermann',
        'TKT-002': 'TEST - Bomassi Rhodney',
        'TKT-003': 'TEST - Oumba Christ',
        'TKT-004': 'TEST - Koud Paola',
        'TKT-005': 'TEST - Opimba Juisson',

        // === INVITÉS RÉELS (006 à 040) ===
        'TKT-005': 'Lourenço Jorge Monteiro',
        'TKT-006': 'Jose Mbala Ponte',
        'TKT-007': 'Ruth Mbala',
        'TKT-008': 'Lutonadio Mendes',
        'TKT-009': 'Cynthia Mpembe',
        'TKT-010': 'Luntala Bianchi',
        'TKT-011': 'Paciencia Lutonda',
        'TKT-012': 'Willi Milando',
        'TKT-013': 'Isabel Dos Anjos',
        'TKT-014': 'Samuel Henriques Kukinda',
        'TKT-015': 'Graça da Conceiçao Vieira',
        'TKT-016': 'Geovana Macaia Paulo',
        'TKT-017': 'Avelino Paxi João Mihiondena',
        'TKT-018': 'Hermenegildo Salgado Gonçalo',
        'TKT-019': 'Jose Tchibinda',
        'TKT-020': 'Carlos Mongo',
        'TKT-021': 'David Bucoi',
        'TKT-022': 'Irene Rebeca Zola',
        'TKT-023': 'Rigueni Antonio',
        'TKT-024': 'Lucas Manuel',
        'TKT-025': 'Manuel Françisco',
        'TKT-026': 'Rosa Garcia Zola',
        'TKT-027': 'Carolina Nsona Nkassa',
        'TKT-028': 'Cristina Kombo Kondi',
        'TKT-029': 'Antónia Rosalina Cristina Ndombaxi',
        'TKT-030': 'Maria Jinga Kahilo',
        'TKT-031': 'Bernice Cristina Ndombaxi',
        'TKT-032': 'Gabriel kinkela kisolo',
        'TKT-033': 'Francisca kianu Nsimba Eduardo',
        'TKT-034': 'Inácio Cunha Filipe',
        'TKT-035': 'Sylvania',
        'TKT-036': 'Cecília Paulo',
        'TKT-037': 'Bernardo Fernando',
        'TKT-038': 'Kubala Sasa Ricardo',
        'TKT-039': 'Carla Mendes',
        'TKT-040': 'José Fernando'
    };

    // Liste des tokens déjà scannés (optionnel)
    const usedTokens = [];

    // =============================================
    // 2. MOT DE PASSE ÉQUIPE
    // =============================================
    const TEAM_PASSWORD = "OK?";

    // =============================================
    // 3. LOGIQUE DE VALIDATION INDIVIDUELLE
    // =============================================
    function validateTicket() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const resultDiv = document.getElementById('result');

        if (!token) {
            resultDiv.innerHTML = '❌ Lien invalide : aucun jeton détecté.';
            resultDiv.className = 'invalid';
            return;
        }

        if (!attendees[token]) {
            resultDiv.innerHTML = '❌ Ticket invalide. Ce code n\'existe pas.';
            resultDiv.className = 'invalid';
            return;
        }

        if (usedTokens.includes(token)) {
            resultDiv.innerHTML = '⚠️ Ce ticket a déjà été utilisé. Contacter l\'organisateur.';
            resultDiv.className = 'used';
            return;
        }

        // ✅ SUCCÈS
        const fullName = attendees[token];
        const isTest = token.match(/^TKT-00[1-5]$/);
        const testBadge = isTest ? '<span style="background:#ffc107; color:#000; font-size:12px; padding:2px 10px; border-radius:12px; margin-left:5px;">TEST</span>' : '';
        resultDiv.innerHTML = `✅ Bienvenue, <strong>${fullName}</strong> ${testBadge}!<br><span style="font-size:14px; font-weight:normal;">Votre ticket est valide.</span>`;
        resultDiv.className = 'valid';
    }

    // =============================================
    // 4. LOGIQUE D'AFFICHAGE DE LA LISTE COMPLÈTE
    // =============================================
    function showFullList() {
        const passInput = document.getElementById('adminPass');
        const listDiv = document.getElementById('fullList');

        if (passInput.value !== TEAM_PASSWORD) {
            listDiv.innerHTML = '<p style="color:red;">❌ Mot de passe incorrect. Accès refusé.</p>';
            return;
        }

        let html = '<h4 style="margin-top:0;">📋 Liste complète des invités</h4>';
        html += '<p style="font-size:12px; color:#888;">🔵 Tokens 001-005 = Tests | 🟢 006-040 = Invités</p><ul>';
        for (const [token, name] of Object.entries(attendees)) {
            const isTest = token.match(/^TKT-00[1-5]$/);
            const badge = isTest ? '<span style="background:#ffc107; color:#000; font-size:10px; padding:1px 8px; border-radius:10px; margin-left:5px;">TEST</span>' : '';
            html += `<li><strong>${token}</strong> – ${name} ${badge}</li>`;
        }
        html += '</ul>';
        listDiv.innerHTML = html;
    }

    // =============================================
    // 5. EXÉCUTION
    // =============================================
    validateTicket();
</script>

</body>
</html>
